services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-18452}:8000"
    environment:
      DB_PATH: /data/tandem-stage.sqlite3
    volumes:
      - ledger:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
volumes:
  ledger:
